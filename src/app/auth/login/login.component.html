<div class="grid h-dvh items-center justify-center">
  <p-toast position="top-right"></p-toast>
  <p-card class="p-4 shadow-4 w-md">
    <div class="text-center mb-5">
      <h1 class="text-3xl font-bold text-900 mb-2">Magical Inventory</h1>
      <p class="text-500 font-medium">Sign in with a passkey</p>
    </div>

    <!-- Email + Passkey Actions -->
    <form [formGroup]="emailForm" (ngSubmit)="loginWithPasskey()" class="grid gap-4">
      <div class="flex flex-column gap-2">
        <label for="email" class="font-semibold text-900">Email Address</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="your@email.com"
          class="w-full"
          [ngClass]="{
            'ng-invalid ng-dirty':
              emailForm.get('email')?.invalid && emailForm.get('email')?.touched,
          }"
        />
        @if (emailForm.get('email')?.invalid && emailForm.get('email')?.touched) {
          <small class="text-red-500"> Please enter a valid email address. </small>
        }
      </div>

      <p-button
        label="Login with Passkey"
        icon="pi pi-sign-in"
        type="submit"
        [loading]="loginStore.loading()"
        [disabled]="emailForm.invalid"
        styleClass="w-full mt-2"
      >
      </p-button>

      <p-button
        label="Register Passkey"
        icon="pi pi-key"
        [outlined]="true"
        [loading]="registerStore.loading()"
        [disabled]="emailForm.invalid"
        (click)="registerPasskey()"
        styleClass="w-full"
      >
      </p-button>
    </form>
  </p-card>
</div>
