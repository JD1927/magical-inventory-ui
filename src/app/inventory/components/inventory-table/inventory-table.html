<p-table
  [value]="filteredRecords()"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 50]"
  [rowHover]="true"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} records"
  [scrollable]="true"
  scrollHeight="calc(100vh - 420px)"
  [size]="'large'"
>
  <ng-template #caption>
    <div class="flex items-center justify-between flex-wrap gap-4">
      <h2 class="text-xl font-bold m-0">Inventory Stock</h2>
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          (input)="onSearch($event)"
          placeholder="Search by SKU..."
          class="w-80"
          [value]="searchTerm()"
        />
        @if (searchTerm()) {
          <p-inputicon class="pi pi-times cursor-pointer" (click)="onClearSearch()" />
        }
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Product SKU</th>
      <th>Product Name</th>
      <th>Stock</th>
      <th>Average Cost</th>
      <th>Last Update</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-record>
    <tr>
      <td>{{ record.product.sku }}</td>
      <td>{{ record.product.name }}</td>
      <td>{{ record.stock }}</td>
      <td>{{ record.averageCost | currency }}</td>
      <td>{{ record.updatedAt | date: 'mediumDate' }}</td>
      <td>
        <p-button
          (onClick)="viewProductMovements.emit(record.product.id)"
          icon="pi pi-chart-bar"
          severity="success"
          aria-label="View Movements"
          pTooltip="View Inventory Movements"
          size="small"
        />
      </td>
    </tr>
  </ng-template>
</p-table>
