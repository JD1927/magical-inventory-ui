<p-table
  [value]="filteredUsers()"
  [loading]="loading()"
  [paginator]="true"
  [totalRecords]="users().length"
  [paginatorPosition]="'bottom'"
  [rows]="10"
  [rowsPerPageOptions]="[10, 20, 50]"
  [rowHover]="true"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
  [scrollable]="true"
  scrollHeight="calc(100vh - 420px)"
  [size]="'large'"
>
  <ng-template #caption>
    <div class="flex items-center justify-between flex-wrap gap-4">
      <h2 class="text-xl font-bold m-0">Users</h2>
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          (input)="onSearch($event)"
          placeholder="Search by email..."
          class="w-80"
          [value]="searchTerm()"
        />
        @if (searchTerm()) {
          <p-inputicon class="pi pi-times cursor-pointer" (click)="onClearSearch()" />
        }
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th>Email</th>
      <th>Role</th>
      <th>Status</th>
      <th>Created At</th>
      <th style="width: 12rem">Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.email }}</td>
      <td>
        <p-tag
          [value]="user.role"
          [severity]="user.role === 'admin' ? 'success' : 'info'"
          [icon]="user.role === 'admin' ? 'pi pi-user' : 'pi pi-user-edit'"
        />
      </td>
      <td>
        <p-tag
          [value]="user.isActive ? 'Active' : 'Inactive'"
          [severity]="user.isActive ? 'success' : 'danger'"
          [icon]="user.isActive ? 'pi pi-check' : 'pi pi-times'"
        />
      </td>
      <td>{{ user.createdAt | date: 'mediumDate' }}</td>
      <td>
        <div class="flex items-center gap-3">
          <p-toggleswitch
            [ngModel]="user.isActive"
            (onChange)="onToggleActive(user)"
            [disabled]="loading()"
            [pTooltip]="user.isActive ? 'Deactivate user' : 'Activate user'"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [outlined]="true"
            size="small"
            (click)="onDelete(user)"
            [loading]="loading()"
            pTooltip="Delete User"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
