<p-table
  [value]="suppliers()"
  [rows]="10"
  [rowsPerPageOptions]="[10, 20, 50]"
  [rowHover]="true"
  [showCurrentPageReport]="true"
  [scrollable]="true"
  scrollHeight="calc(100vh - 420px)"
  [size]="'large'"
>
  <ng-template #header>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>NIT</th>
      <th>Address</th>
      <th>Contact Number</th>
      <th>Email</th>
      <th>Last Update</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-supplier>
    <tr>
      <td>{{ supplier.name }}</td>
      <td [pTooltip]="supplier.description" tooltipPosition="bottom">
        {{ supplier.description | truncate: 25 }}
      </td>
      <td>{{ supplier.nit }}</td>
      <td [pTooltip]="supplier.address" tooltipPosition="bottom">
        {{ supplier.address | truncate: 25 }}
      </td>
      <td>{{ supplier.contactNumber }}</td>
      <td>{{ supplier.email }}</td>
      <td>{{ supplier.updatedAt | date: 'mediumDate' }}</td>
      <td>
        <div class="flex gap-2">
          <p-button
            (onClick)="updateSupplier.emit(supplier.id)"
            icon="pi pi-pencil"
            severity="warn"
            aria-label="Update supplier"
            size="small"
            pTooltip="Update supplier"
          />
          <p-button
            (onClick)="onDelete(supplier.id, $event)"
            icon="pi pi-trash"
            severity="danger"
            aria-label="Delete supplier"
            size="small"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
